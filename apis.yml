  name: TaxiQL Query API
  description: >-
    TaxiQL is a declarative query language for federated data retrieval across multiple APIs and data
    sources. Queries specify the desired data structure using semantic types and Taxi automatically discovers
    the data paths, calls APIs, and assembles results.
  humanURL: https://docs.taxilang.org/language-reference/querying-with-taxiql/

naftiko: 1.0.0-alpha2
info:
  label: Taxi Language API — Conversion
  description: 'Taxi Language API — Conversion. 1 operations. Lead operation: Convert from OpenAPI. Self-contained Naftiko
    capability covering one Taxi business surface.'
  tags:
  - Taxi
  - Conversion
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TAXI_API_KEY: TAXI_API_KEY
capability:
  consumes:
  - type: http
    namespace: language-conversion
    baseUri: https://api.taxilang.org
    description: Taxi Language API — Conversion business capability. Self-contained, no shared references.
    resources:
    - name: convert-openapi
      path: /convert/openapi
      operations:
      - name: convertfromopenapi
        method: POST
        description: Convert from OpenAPI
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
  exposes:
  - type: rest
    namespace: language-conversion-rest
    port: 8080
    description: REST adapter for Taxi Language API — Conversion. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/convert/openapi
      name: convert-openapi
      description: REST surface for convert-openapi.
      operations:
      - method: POST
        name: convertfromopenapi
        description: Convert from OpenAPI
        call: language-conversion.convertfromopenapi
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: language-conversion-mcp
    port: 9090
    transport: http
    description: MCP adapter for Taxi Language API — Conversion. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: convert-openapi
      description: Convert from OpenAPI
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: language-conversion.convertfromopenapi
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.

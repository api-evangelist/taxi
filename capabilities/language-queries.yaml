naftiko: 1.0.0-alpha2
info:
  label: Taxi Language API — Queries
  description: 'Taxi Language API — Queries. 2 operations. Lead operation: Execute TaxiQL Query. Self-contained Naftiko capability
    covering one Taxi business surface.'
  tags:
  - Taxi
  - Queries
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TAXI_API_KEY: TAXI_API_KEY
capability:
  consumes:
  - type: http
    namespace: language-queries
    baseUri: https://api.taxilang.org
    description: Taxi Language API — Queries business capability. Self-contained, no shared references.
    resources:
    - name: queries
      path: /queries
      operations:
      - name: executequery
        method: POST
        description: Execute TaxiQL Query
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: queries-query_id
      path: /queries/{query_id}
      operations:
      - name: getquerystatus
        method: GET
        description: Get Query Status
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: query_id
          in: path
          type: string
          description: Query execution ID
          required: true
  exposes:
  - type: rest
    namespace: language-queries-rest
    port: 8080
    description: REST adapter for Taxi Language API — Queries. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/queries
      name: queries
      description: REST surface for queries.
      operations:
      - method: POST
        name: executequery
        description: Execute TaxiQL Query
        call: language-queries.executequery
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/queries/{query-id}
      name: queries-query-id
      description: REST surface for queries-query_id.
      operations:
      - method: GET
        name: getquerystatus
        description: Get Query Status
        call: language-queries.getquerystatus
        with:
          query_id: rest.query_id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: language-queries-mcp
    port: 9090
    transport: http
    description: MCP adapter for Taxi Language API — Queries. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: execute-taxiql-query
      description: Execute TaxiQL Query
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: language-queries.executequery
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-query-status
      description: Get Query Status
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: language-queries.getquerystatus
      with:
        query_id: tools.query_id
      outputParameters:
      - type: object
        mapping: $.

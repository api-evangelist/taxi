naftiko: 1.0.0-alpha2
info:
  label: Taxi Language API — Schemas
  description: 'Taxi Language API — Schemas. 4 operations. Lead operation: List Schemas. Self-contained Naftiko capability
    covering one Taxi business surface.'
  tags:
  - Taxi
  - Schemas
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TAXI_API_KEY: TAXI_API_KEY
capability:
  consumes:
  - type: http
    namespace: language-schemas
    baseUri: https://api.taxilang.org
    description: Taxi Language API — Schemas business capability. Self-contained, no shared references.
    resources:
    - name: schemas
      path: /schemas
      operations:
      - name: listschemas
        method: GET
        description: List Schemas
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: namespace
          in: query
          type: string
          description: Filter by namespace
        - name: limit
          in: query
          type: integer
          description: Maximum results to return
      - name: registerschema
        method: POST
        description: Register Schema
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: schemas-compile
      path: /schemas/compile
      operations:
      - name: compileschema
        method: POST
        description: Compile Schema
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: schemas-schema_id
      path: /schemas/{schema_id}
      operations:
      - name: getschema
        method: GET
        description: Get Schema
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: schema_id
          in: path
          type: string
          description: Schema identifier
          required: true
  exposes:
  - type: rest
    namespace: language-schemas-rest
    port: 8080
    description: REST adapter for Taxi Language API — Schemas. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/schemas
      name: schemas
      description: REST surface for schemas.
      operations:
      - method: GET
        name: listschemas
        description: List Schemas
        call: language-schemas.listschemas
        with:
          namespace: rest.namespace
          limit: rest.limit
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: registerschema
        description: Register Schema
        call: language-schemas.registerschema
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/schemas/compile
      name: schemas-compile
      description: REST surface for schemas-compile.
      operations:
      - method: POST
        name: compileschema
        description: Compile Schema
        call: language-schemas.compileschema
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/schemas/{schema-id}
      name: schemas-schema-id
      description: REST surface for schemas-schema_id.
      operations:
      - method: GET
        name: getschema
        description: Get Schema
        call: language-schemas.getschema
        with:
          schema_id: rest.schema_id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: language-schemas-mcp
    port: 9090
    transport: http
    description: MCP adapter for Taxi Language API — Schemas. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: list-schemas
      description: List Schemas
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: language-schemas.listschemas
      with:
        namespace: tools.namespace
        limit: tools.limit
      outputParameters:
      - type: object
        mapping: $.
    - name: register-schema
      description: Register Schema
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: language-schemas.registerschema
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: compile-schema
      description: Compile Schema
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: language-schemas.compileschema
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-schema
      description: Get Schema
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: language-schemas.getschema
      with:
        schema_id: tools.schema_id
      outputParameters:
      - type: object
        mapping: $.

specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
provider: Taxi - Describe How Your APIs and Data Relate
providerId: taxi-describe-how-your-apis-and-data-relate
publisherName: Orbital HQ
serviceCategory: Data Integration
created: '2026-05-04'
modified: '2026-05-05'
reconciled: true
tags:
  - Data Integration
  - Federated Query
  - Open Source
  - FinOps
  - FOCUS
description: FOCUS-aligned FinOps shape for the commercial Orbital platform that executes TaxiQL
  queries against the Taxi schema registry. Billing is a tiered subscription with monthly call
  quotas, per-additional-user fees, an AI Copilot add-on, and metered overage; the Taxi language
  itself is Apache 2.0 open source and not directly billed.
sources:
  - https://taxilang.org/
  - https://orbitalhq.com/pricing
billingModel:
  pricingCategory: Tiered Subscription
  billingFrequency: Annual
  billingCurrency: USD
  chargeCategories:
    - Purchase
    - Usage
focusColumns:
  ServiceName: Orbital
  ServiceCategory: Data Integration
  ProviderName: Orbital
  PublisherName: Orbital HQ
  InvoiceIssuerName: Orbital HQ
  BillingCurrency: USD
  PricingUnit: subscription-month
meters:
  - name: subscription_tier
    unit: month
    aggregation: max
    dimensions:
      - tier
  - name: api_calls
    unit: request
    aggregation: sum
    dimensions:
      - workspace
      - tier
  - name: workspaces
    unit: workspace
    aggregation: max
    dimensions:
      - tier
  - name: endpoints
    unit: endpoint
    aggregation: max
    dimensions:
      - workspace
  - name: admin_users
    unit: seat
    aggregation: max
    dimensions:
      - tier
  - name: additional_users
    unit: seat
    aggregation: max
    dimensions:
      - tier
  - name: ai_copilot_seats
    unit: seat
    aggregation: max
  - name: overage_calls
    unit: request
    aggregation: sum
    dimensions:
      - tier
  - name: managed_onprem
    unit: month
    aggregation: max
principles:
  - name: Visibility
    description: Track Orbital monthly call consumption against the tier ceiling (100K / 1M /
      10M / 100M / 1B) so overage at $200-$400 per 10M calls is forecast, not surprise. Workspace
      and endpoint counts are visible in the Orbital console.
  - name: Allocation
    description: Allocate by Orbital workspace and tier so each consuming team's call volume,
      additional-user seats, and AI Copilot seats can be charged back distinctly.
  - name: Optimization
    description: Right-size the tier against monthly call volume, push pure-OSS use of Taxi /
      TaxiQL down into self-hosted environments where managed Orbital execution isn't required,
      and consolidate endpoints inside fewer workspaces to stay within the per-tier endpoint cap.
  - name: Accountability
    description: The data integration / platform team that owns the Orbital workspace owns the
      subscription tier choice, additional-user count, and AI Copilot seat allocation.
maintainers:

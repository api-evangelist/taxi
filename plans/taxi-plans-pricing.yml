description: The Taxi language and TaxiQL are open source (Apache 2.0) and have no commercial
  pricing. The companion Orbital platform from Orbital HQ (which hosts and executes TaxiQL queries
  and the Taxi schema registry) is the commercial offering and publishes a tiered usage-based
  subscription with monthly call quotas, workspace caps, endpoint caps, and overage and add-on
  pricing.
sources:
  - https://taxilang.org/
  - https://orbitalhq.com
  - https://orbitalhq.com/pricing
plans:
  - id: taxi-language-open-source
    name: Taxi Language (Open Source)
    type: freemium
    description: The Taxi language, TaxiQL, and the Taxi Playground are Apache 2.0 open source
      and free to use. There is no per-seat or per-call charge for the language itself.
    entries:
      - label: Open Source Use
        name: open_source_use
        type: flat
        metric: usage
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: Taxi Language
      - name: TaxiQL Query Language
      - name: Taxi Playground
      - name: Apache 2.0 License
  - id: taxi-orbital-free

description: The Taxi language itself is an Apache 2.0 open source schema language with no rate
  limits. The companion Orbital platform that executes TaxiQL queries enforces capacity through
  monthly call quotas tied to the subscription tier rather than per-second / per-minute throttles
  documented at the protocol level. There is no public Orbital rate-limit specification beyond
  the per-tier monthly call ceilings.
sources:
  - https://taxilang.org/
  - https://orbitalhq.com/pricing
notes: No public per-second / per-minute throttling documentation found for Orbital; capacity is
  governed by the subscription tier's monthly call quota. Reconciled left false until the Orbital
  team publishes explicit per-window limits.
responseCodes:
  throttled: 429
limits:
  - name: Orbital Free monthly calls
    scope: workspace
    metric: requests_per_month
    limit: 100000
    timeFrame: month
    notes: Free-tier monthly call ceiling per Orbital pricing.
  - name: Orbital Team monthly calls
    scope: workspace
    metric: requests_per_month
    limit: 1000000
    timeFrame: month
  - name: Orbital Business monthly calls
    scope: workspace
    metric: requests_per_month
    limit: 10000000
    timeFrame: month
  - name: Orbital Platform monthly calls
    scope: workspace
    metric: requests_per_month
    limit: 100000000
    timeFrame: month
  - name: Orbital Enterprise monthly calls
    scope: workspace
    metric: requests_per_month
    limit: 1000000000
    timeFrame: month
policies:
  - name: Quota-Based Enforcement
    description: Orbital enforces capacity primarily through the subscription tier's monthly call
      quota. Overage is billed per 10M calls and varies by tier ($200-$400 per 10M).
  - name: Open Source Locality
    description: The Taxi schema language and TaxiQL are open source and run wherever the consumer
      hosts them; rate limiting only applies when querying through a managed Orbital workspace.
